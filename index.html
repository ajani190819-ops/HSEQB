<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSE Quiz Bowl Tracker</title>
<meta name="robots" content="noindex">
<!-- The HSE app moved into apps/hse/ when this repo became a multi-app
     monorepo. This page keeps every legacy URL (bookmarks, installed PWAs,
     old shared links) working by forwarding to the app's new location. -->
<link rel="canonical" href="apps/hse/">
<meta http-equiv="refresh" content="0; url=apps/hse/">
</head>
<body>
<script>
(function () {
  try {
    // Build the target from the current path so search + hash survive,
    // and so this works no matter where the repo is published.
    var base = window.location.pathname.replace(/index\.html$/, '');
    if (base.charAt(base.length - 1) !== '/') base += '/';
    window.location.replace(base + 'apps/hse/' + window.location.search + window.location.hash);
  } catch (e) { /* meta refresh above is the fallback */ }
}());
</script>
<noscript><p>Redirecting… <a href="apps/hse/">Continue to the HSE Quiz Bowl Tracker</a>.</p></noscript>
<p>Redirecting… <a href="apps/hse/">Continue to the HSE Quiz Bowl Tracker</a>.</p>
</body>
</html>
