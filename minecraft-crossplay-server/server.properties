# Minecraft Server Properties
# Optimized for Laptop hosting & Cross-Play (Java + Bedrock)

# Network & Ports
server-port=25565
server-ip=
enable-query=false
enable-rcon=false
network-compression-threshold=256
prevent-proxy-connections=false

# Gameplay & Difficulty
gamemode=survival
force-gamemode=false
difficulty=normal
hardcore=false
pvp=true
allow-flight=false
enable-command-block=true
spawn-animals=true
spawn-monsters=true
spawn-npcs=true
spawn-protection=0

# World Settings
level-name=world
level-seed=
level-type=minecraft\:normal
generator-settings={}
generate-structures=true
allow-nether=true
max-world-size=29999984

# Performance & Laptop Optimizations
view-distance=8
simulation-distance=5
entity-broadcast-range-percentage=100
max-players=20
max-tick-time=60000
rate-limit=0
sync-chunk-writes=true

# Security & Authentication (Floodgate handles Bedrock securely)
online-mode=true
enforce-secure-profile=false
enforce-whitelist=false
white-list=false
hide-online-players=false

# MOTD (Server description displayed in server list)
motd=\u00a7aCrossplay Server \u00a77\u00bb \u00a7bJava \u00a77+ \u00a7eBedrock \u00a76[1.21+]
