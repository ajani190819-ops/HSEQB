# Minecraft Server Properties
# Optimized for "Floor 5 Worldwide" 16GB Dedicated Laptop Hosting

# Network & Ports
server-port=25565
server-ip=
enable-query=false
enable-rcon=false
network-compression-threshold=256
prevent-proxy-connections=false

# Gameplay & Server Settings
gamemode=survival
force-gamemode=false
difficulty=normal
hardcore=false
pvp=true
allow-flight=false
enable-command-block=true
spawn-animals=true
spawn-monsters=true
spawn-npcs=true
spawn-protection=0
max-players=50

# World Settings
level-name=world
level-seed=
level-type=minecraft\:normal
generator-settings={}
generate-structures=true
allow-nether=true
max-world-size=29999984

# Render & Simulation Performance (Customized for 16GB RAM)
view-distance=16
simulation-distance=8
entity-broadcast-range-percentage=100
max-tick-time=60000
rate-limit=0
sync-chunk-writes=true

# Security & Authentication
online-mode=true
enforce-secure-profile=false
enforce-whitelist=false
white-list=false
hide-online-players=false

# MOTD (Server List Header & Subtitle)
# Line 1: Bold Gold FLOOR 5 WORLDWIDE with stars
# Line 2: Bold Cyan Crossplay (Java + Bedrock)
