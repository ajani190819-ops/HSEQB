# ---------------------------------------------------------------------------------
# Geyser Configuration File (Geyser-Spigot)
# Geyser is a bridge/proxy allowing Bedrock clients to join Java edition servers.
# ---------------------------------------------------------------------------------

bedrock:
  # The IP address Bedrock clients connect to (0.0.0.0 listens on all interfaces)
  address: 0.0.0.0
  # The default Bedrock UDP port
  port: 19132
  # Set to true if you want Geyser to use the port defined in remote.port
  clone-remote-port: false
  # MOTD lines shown in the Bedrock server list
  motd1: "§aCrossplay Minecraft Server"
  motd2: "§bJava + Bedrock Supported!"
  # Server name displayed in the pause menu
  server-name: "Geyser Crossplay"
  # Compression level (0 to 9, 6 is balanced for laptops)
  compression-level: 6
  # Broadcast local LAN presence so Bedrock players on Wi-Fi see it in Friends tab
  broadcast-sub-domain: true

remote:
  # The address of your local Paper Java server
  address: 127.0.0.1
  # The port of your local Paper Java server
  port: 25565
  # Authentication type:
  # 'floodgate' = Bedrock players join using their Xbox gamertag without needing a Java account
  # 'online' = Bedrock players must log into a valid paid Java account
  # 'offline' = No authentication (not recommended)
  auth-type: floodgate
  # Use HAProxy proxy protocol
  use-proxy-protocol: false
  # Forward hostname to server
  forward-hostname: false

# Bedrock Player Options
floodgate-key-file: key.pem
saved-user-logins: []
command-suggestions: true
passthrough-motd: true
passthrough-player-counts: true
passthrough-protocol-name: false
passthrough-ping-response: true
legacy-ping-passthrough: false
ping-passthrough-interval: 3
forward-player-ping: true

# In-Game Emulation & Mechanics
show-cooldown: title
show-coordinates: true
custom-sky: true
disable-bedrock-scaffolding: false
below-bedrock-nether-building: false
hide-bedrock-skins: false
allow-third-party-capes: true
allow-third-party-ears: true
show-entity-ids: false

# Chat & Commands
emulate-post-1-19-bedrock-chat: true
scoreboard-packet-threshold: 20
enable-proxy-connections: false
mtu: 1400
use-direct-connection: true

# Config Version (Do not change)
config-version: 4
