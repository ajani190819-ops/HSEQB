# Bukkit Configuration File
# Optimized for smooth laptop hosting
settings:
  allow-end: true
  warn-on-overload: true
  permissions-file: permissions.yml
  update-folder: update
  plugin-profiling: false
  connection-throttle: 4000
  query-plugins: true
  deprecated-verbose: default
  shutdown-message: Server closed
  minimum-api: none

spawn-limits:
  monsters: 50
  animals: 10
  water-animals: 5
  water-ambient: 5
  water-underground-creature: 3
  ambient: 5
  axolotls: 5

ticks-per:
  animal-spawns: 400
  monster-spawns: 1
  water-spawns: 400
  water-ambient-spawns: 400
  water-underground-creature-spawns: 400
  ambient-spawns: 400
  axolotl-spawns: 400
  autosave: 6000

chunk-gc:
  period-in-ticks: 600
